name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build-ios.sh'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web assets and sync them into the iOS project
        env:
          PIDASH_API_URL: ${{ secrets.PIDASH_API_URL }}
        run: |
          test -n "$PIDASH_API_URL" || { echo "Add the PIDASH_API_URL repository secret (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          VITE_API_BASE="$PIDASH_API_URL" npx vite build
          npx cap sync ios
      - name: Allow plain HTTP to the API address only
        env:
          PIDASH_API_URL: ${{ secrets.PIDASH_API_URL }}
        run: |
          host=$(echo "$PIDASH_API_URL" | sed -E 's|^https?://([^/:]+).*|\1|')
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:$host dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:$host:NSExceptionAllowsInsecureHTTPLoads bool true" "$P"
      - name: Build the unsigned .ipa
        run: ./build-ios.sh
      - name: Print the end of the build log on failure
        if: failure()
        run: tail -80 build-log.txt || true
      - name: Collect the IPA
        run: mkdir out && cp pidash-unsigned.ipa out/pidash-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: pidash-ipa
          path: out/pidash-unsigned.ipa
          retention-days: 14
